# genparse configuration. Every key is optional; these are the defaults.

[server]
bind = "0.0.0.0:8080"
max_upload_bytes = 33554432      # 32 MiB, enforced while the upload streams in
request_timeout_secs = 300       # upstream model call timeout

[cache]
enabled = true                   # set to false to always call the model
dir = ".genparse-cache"          # on-disk store; results survive restarts
ttl_secs = 604800                # 7 days; 0 = never expire

[extraction]
default_model = "haiku"          # alias from [models], or "provider:model-id"
nullable_leaves = true           # inferred schemas let the model answer null for missing fields
max_output_tokens = 16000
max_text_chars = 1000000         # cap on the text rendered from a spreadsheet or .docx upload
prompt = """Extract the requested fields from the attached document. Return only JSON that matches the schema. Copy values exactly as they appear in the document; do not invent data. Use null for any field the document does not contain."""

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
fallbacks = true                 # server-side refusal fallback (sent for Sonnet/Opus/Fable, not Haiku)

[providers.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"

[providers.gemini]
api_key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com"

# OpenAI-compatible chat-completions providers without file input. Uploads reach
# them as text (PDFs via their text layer, so scanned PDFs need Claude/GPT/Gemini).
# Structured output is best-effort: the schema goes in the prompt plus JSON mode.
[providers.deepseek]
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
json_mode = true                 # send response_format = json_object

[providers.zai]
api_key_env = "ZAI_API_KEY"
base_url = "https://api.z.ai/api/paas/v4"   # mainland accounts: https://open.bigmodel.cn/api/paas/v4
json_mode = true

[providers.xiaomi]
api_key_env = "XIAOMI_API_KEY"
base_url = "https://api.xiaomimimo.com/v1"
json_mode = true

# Short names callers can pass as `model=`. Value is "provider:model-id".
# Providers: anthropic | openai | gemini | deepseek | zai | xiaomi.
[models]
flash = "gemini:gemini-3.6-flash"
flash-lite = "gemini:gemini-3.5-flash-lite"
luna = "openai:gpt-6-luna"
nano = "openai:gpt-5-nano"
haiku = "anthropic:claude-haiku-5-5"
sonnet = "anthropic:claude-sonnet-5-5"
opus = "anthropic:claude-opus-5-5"
fable = "anthropic:claude-fable-5-1"      # most capable; needs 30-day data retention (not ZDR)
# Older Claude ids work verbatim, e.g. model=anthropic:claude-opus-5 or claude-haiku-4-5
deepseek-flash = "deepseek:deepseek-v4-flash"
glm-flash = "zai:glm-4.7-flash"          # GLM-5.3-Flash exists too; confirm its id via GET {base_url}/models
mimo-flash = "xiaomi:mimo-v2.6-flash"    # older id: mimo-v2-flash
# "instant" has no verified public API id yet; add it here once you know it, e.g.
# instant = "openai:<model-id>"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="genparse: documents in, structured JSON out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#15213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="180" fill="#60a5fa" fill-opacity="0.07"/>
  <circle cx="860" cy="300" r="120" fill="#5eead4" fill-opacity="0.06"/>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="152" font-size="84" font-weight="800" letter-spacing="-3" fill="#f8fafc">gen<tspan fill="url(#accent)">parse</tspan></text>
    <text x="76" y="200" font-size="24" font-weight="500" fill="#cbd5e1">Documents in. Structured JSON out.</text>
    <text x="76" y="236" font-size="16" fill="#7c8aa5">PDF · XLSX · DOCX  →  your schema, filled by Claude, GPT or Gemini</text>
  </g>

  <!-- illustration: document -> braces -->
  <g transform="translate(700 70)">
    <!-- document stack -->
    <rect x="26" y="14" width="124" height="160" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="14" y="26" width="124" height="160" rx="12" fill="#243049" stroke="#3b4a66"/>
    <rect x="2" y="38" width="124" height="160" rx="12" fill="#2b3a57" stroke="#4b5c7c"/>
    <path d="M94 38v26a8 8 0 0 0 8 8h24" fill="none" stroke="#4b5c7c"/>
    <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
      <line x1="22" y1="86" x2="88" y2="86"/>
      <line x1="22" y1="108" x2="104" y2="108"/>
      <line x1="22" y1="130" x2="70" y2="130"/>
      <line x1="22" y1="152" x2="96" y2="152"/>
      <line x1="22" y1="174" x2="60" y2="174"/>
    </g>

    <!-- arrow -->
    <g filter="url(#glow)">
      <path d="M162 118h92" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <path d="M236 98l24 20-24 20" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- json card -->
    <rect x="290" y="30" width="200" height="176" rx="14" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15">
      <text x="310" y="64" fill="#5eead4">{</text>
      <text x="326" y="90" fill="#93c5fd">"invoice"<tspan fill="#cbd5e1">:</tspan> <tspan fill="#fde68a">"INV-7"</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="326" y="116" fill="#93c5fd">"total"<tspan fill="#cbd5e1">:</tspan> <tspan fill="#f9a8d4">1250.00</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="326" y="142" fill="#93c5fd">"paid"<tspan fill="#cbd5e1">:</tspan> <tspan fill="#c4b5fd">false</tspan><tspan fill="#cbd5e1">,</tspan></text>
      <text x="326" y="168" fill="#93c5fd">"items"<tspan fill="#cbd5e1">:</tspan> <tspan fill="#5eead4">[</tspan><tspan fill="#64748b">…</tspan><tspan fill="#5eead4">]</tspan></text>
      <text x="310" y="194" fill="#5eead4">}</text>
    </g>
  </g>
</svg>

[package]
name = "genparse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace", "limit", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
